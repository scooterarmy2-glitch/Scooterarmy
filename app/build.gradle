plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.scooterarmy.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.scooterarmy.app"
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName "1.1.0"
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    // Fonts: Orbitron / Share Tech Mono ship as base64 text (res/raw/*.b64)
    // because binary font files cannot be pushed through the GitHub
    // connector. They are decoded at RUNTIME by FontLoader (on first use)
    // — there is no build-time font step at all, by design: build-time
    // font decoding failed four straight builds on Gradle task wiring.
}

dependencies {
    // Route map (VIEW ROUTE) + live map — Esri dark tiles, no API key
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
    // Main pager: speedometer page + live map page (swipe right).
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    // Fused Location Provider — fast lock + smooth fixes in town/trees.
    // Speed/timing still come from raw GPS_PROVIDER (Doppler) only.
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
