plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.scooterarmy.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.scooterarmy.app"
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName "1.1.0"
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    // Orbitron / Share Tech Mono ship as base64 text (res/raw/*.b64) because
    // binary font files cannot be pushed through the GitHub connector.
    // decodeFonts (below) decodes them into real .ttf font resources.
    // NOTE: the generated res dir is NOT added via sourceSets.res.srcDirs —
    // that made every resource task consume decodeFonts' output with no
    // declared dependency, and Gradle validation then failed one task at a
    // time (Build #50 merge, #52 generate, #53 package). It is registered
    // through the AGP variant sources API instead (see androidComponents
    // below), which declares decodeFonts as its producer once.
}

tasks.register('decodeFonts') {
    def rawDir = file('src/main/res/raw')
    def outDir = file("${project.buildDir}/generated/res/font")
    inputs.dir(rawDir)
    outputs.dir(outDir)
    doLast {
        outDir.mkdirs()
        ['orbitron_400', 'orbitron_700', 'orbitron_900', 'share_tech_mono'].each { name ->
            def b64 = new File(rawDir, name + '.b64').text.replaceAll('\\s', '')
            new File(outDir, name + '.ttf').bytes = b64.decodeBase64()
        }
    }
}

// ROOT FIX for Builds #50/#52/#53 — ends the whack-a-mole, do not revert to
// per-task dependsOn wiring. Previously the generated res dir was declared
// via sourceSets.res.srcDirs and decodeFonts was wired to individual tasks
// (merge, then generate) — each patch just revealed the next undeclared
// consumer (packageReleaseResources in #53, then process*Resources, ...).
// Registering the directory through the AGP variant sources API declares
// decodeFonts as the producer of the directory ONCE, so every downstream
// resource task — generate, merge, package, process, both variants, APK
// and AAB — implicitly depends on it.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.res?.addGeneratedSourceDirectory(tasks.named('decodeFonts')) {
            layout.buildDirectory.dir('generated/res')
        }
    }
}

dependencies {
    // Route map (VIEW ROUTE) — OpenStreetMap tiles, no API key
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
    // Fused Location Provider — fast lock + smooth fixes in town/trees.
    // Speed/timing still come from raw GPS_PROVIDER (Doppler) only.
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
