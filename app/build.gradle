plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.scooterarmy.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.scooterarmy.app"
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName "1.1.0"
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    // Orbitron / Share Tech Mono ship as base64 text (res/raw/*.b64) because
    // binary font files cannot be pushed through the GitHub connector.
    // This task decodes them into real .ttf font resources before merging.
    sourceSets {
        main {
            res.srcDirs += "${project.buildDir}/generated/res"
        }
    }
}

tasks.register('decodeFonts') {
    def rawDir = file('src/main/res/raw')
    def outDir = file("${project.buildDir}/generated/res/font")
    inputs.dir(rawDir)
    outputs.dir(outDir)
    doLast {
        outDir.mkdirs()
        ['orbitron_400', 'orbitron_700', 'orbitron_900', 'share_tech_mono'].each { name ->
            def b64 = new File(rawDir, name + '.b64').text.replaceAll('\\s', '')
            new File(outDir, name + '.ttf').bytes = b64.decodeBase64()
        }
    }
}

// Build #50 fix: AGP creates the merge<Variant>Resources tasks AFTER this
// script is evaluated, so tasks.named('mergeDebugResources') threw at
// configuration time ("Task with name 'mergeDebugResources' not found").
// configureEach on the live matching view wires decodeFonts in whenever
// AGP creates the tasks — covers both assembleRelease and bundleRelease
// (both merge release resources).
tasks.matching { it.name == 'mergeDebugResources' || it.name == 'mergeReleaseResources' }.configureEach {
    dependsOn 'decodeFonts'
}

dependencies {
    // Route map (VIEW ROUTE) — OpenStreetMap tiles, no API key
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
    // Fused Location Provider — fast lock + smooth fixes in town/trees.
    // Speed/timing still come from raw GPS_PROVIDER (Doppler) only.
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
