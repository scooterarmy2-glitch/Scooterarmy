name: Build #scooterarmy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Embed Google Fonts offline
        run: |
          python3 << 'PYEOF'
          import urllib.request, base64, re

          UA = 'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/112.0.0.0 Mobile Safari/537.36'

          def fetch_css(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req) as r:
                  return r.read().decode('utf-8')

          def fetch_bytes(url):
              with urllib.request.urlopen(url) as r:
                  return r.read()

          print("Fetching font CSS...")
          css1 = fetch_css('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap')
          css2 = fetch_css('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap')
          combined = css1 + '\n' + css2

          font_urls = re.findall(r'url\((https://[^)]+)\)', combined)
          print(f"Found {len(font_urls)} font files")

          for url in font_urls:
              data = fetch_bytes(url)
              b64 = base64.b64encode(data).decode('ascii')
              combined = combined.replace(url, f'data:font/woff2;base64,{b64}')

          with open('app/src/main/assets/index.html', 'r', encoding='utf-8') as f:
              html = f.read()

          pattern = r'<link[^>]*fonts\.googleapis\.com[^>]*>'
          replacement = f'<style>/* FONTS EMBEDDED OFFLINE */\n{combined}\n</style>'
          new_html, count = re.subn(pattern, replacement, html)
          print(f"Font replacements: {count}")

          with open('app/src/main/assets/index.html', 'w', encoding='utf-8') as f:
              f.write(new_html)
          print("Fonts embedded!")
          PYEOF

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/scooterarmy.keystore

      - name: Build Release APK
        run: |
          gradle assembleRelease

      - name: Sign APK
        run: |
          # Use apksigner from Android SDK to sign the release APK
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/34.0.0/apksigner"
          INPUT=app/build/outputs/apk/release/app-release-unsigned.apk
          OUTPUT=app/build/outputs/apk/release/app-release.apk

          # Check which file exists
          if [ -f "$INPUT" ]; then
            echo "Signing unsigned APK..."
            $APKSIGNER sign \
              --ks app/scooterarmy.keystore \
              --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
              --key-pass pass:${{ secrets.KEY_PASSWORD }} \
              --ks-key-alias ${{ secrets.KEY_ALIAS }} \
              --out $OUTPUT \
              $INPUT
          else
            echo "No unsigned APK found, checking for release APK..."
            ls app/build/outputs/apk/release/
          fi

          SIZE=$(stat -c%s "$OUTPUT" 2>/dev/null || echo 0)
          echo "Signed APK size: $SIZE bytes"
          if [ "$SIZE" -lt 500000 ]; then
            echo "ERROR: APK too small after signing"
            exit 1
          fi

      - name: Copy APK to docs
        run: cp app/build/outputs/apk/release/app-release.apk docs/scooterarmy-gps.apk

      - name: Commit APK to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/scooterarmy-gps.apk
          git diff --staged --quiet || git commit -m "Auto-update APK [skip ci]"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scooterarmy-gps-signed
          path: docs/scooterarmy-gps.apk
          retention-days: 30
